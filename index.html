<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>🛠️ Utilitários Linux</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>🛠️ Utilitários Linux</h1>

  <div class="button-group">
    <button onclick="run('ativar_asteriscos.sh')">Ativar Asteriscos no SUDO</button>
    <button onclick="run('configurar_fsck.sh')">Forçar fsck no boot</button>
    <button onclick="run('configurar_fish.sh')">Configurar Fish</button>
    <button onclick="run('instalar_wine.sh')">Instalar Wine</button>
    <button onclick="run('criar_atalho_desinstalador_wine.sh')">Atalho desinstalador do Wine</button>
    <button onclick="run('instalar_steam.sh')">Instalar Steam</button>
    <button onclick="run('steam_fix.sh')">Steam Fix</button>
    <button onclick="run('instalar_gimp.sh')">Instalar GIMP</button>
    <button onclick="run('instalar_inkscape.sh')">Instalar Inkscape</button>
    <button onclick="run('instalar_krita.sh')">Instalar Krita</button>
    <button onclick="run('instalar_neofetch.sh')">Instalar Neofetch</button>
    <button onclick="run('instalar_fastfetch.sh')">Instalar Fastfetch</button>
    <button onclick="run('instalar_yay.sh')">Instalar Yay</button>
    <button onclick="run('config_timeshift.sh')">Instalar e configurar Timeshift</button>
    <button onclick="run('install_node.sh')">Instalar Node.js</button>
  </div>

  <button id="toggle-terminal" class="toggle-btn">Mostar Terminal</button>

  <pre id="output"></pre>

  <script src="renderer.js"></script>
  <script>
    const toggleBtn = document.getElementById('toggle-terminal');
    const output = document.getElementById('output');

    toggleBtn.addEventListener('click', () => {
      if (output.style.display === 'block') {
        output.style.display = 'none';
        toggleBtn.textContent = 'Mostrar Terminal';
      } else {
        output.style.display = 'block';
        toggleBtn.textContent = 'Ocultar Terminal';
      }
    });
  </script>
</body>
</html>
