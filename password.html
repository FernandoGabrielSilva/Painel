<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Senha Root</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h2>Digite a senha root:</h2>
  <div id="error-message" class="error"></div>

  <input type="password" id="password" autofocus>
  <br>
  <button onclick="sendPassword()">Confirmar</button>

  <script>
    // Lê parâmetros da URL para mostrar erro, se houver
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    if (error) {
      document.getElementById("error-message").textContent = error;
    }

    function sendPassword() {
      const pass = document.getElementById("password").value;
      window.electronAPI.submitPassword(pass);
    }
  </script>
</body>
</html>
